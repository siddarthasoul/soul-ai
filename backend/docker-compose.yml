services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: soul-backend

    expose:
      - "8000"

    env_file:
      - .env

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - soul-network

    restart: unless-stopped

  nginx:
    image: nginx:alpine

    container_name: soul-nginx

    ports:
      - "80:80"

    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - backend

    networks:
      - soul-network

    restart: unless-stopped

networks:
  soul-network:
    driver: bridge